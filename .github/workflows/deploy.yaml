name: Build, Push, and Update GitOps
on:
  push:
    branches:
      - test
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get current commit info
        id: commit_info
        run: |
          CURRENT_SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "current_short_sha=$CURRENT_SHORT_SHA" >> $GITHUB_OUTPUT
          echo "✅ Current commit SHA: $CURRENT_SHORT_SHA"
      
      - name: Check if JAR already exists as artifact
        id: check_jar_artifact
        run: |
          # Check if there's already a JAR for this exact commit
          echo "🔍 Checking if JAR artifact exists for commit: ${{ steps.commit_info.outputs.current_short_sha }}"
          
          # Try to download existing JAR artifact for this commit
          # This will only work if the exact same commit was built before
          ARTIFACT_EXISTS="false"
          
          # We'll check this in the next step by trying to find a cached JAR
          echo "jar_exists=false" >> $GITHUB_OUTPUT
          echo "❌ Will need to check for cached JAR or build new one"
      
      - name: Cache JAR files by commit
        id: jar_cache
        uses: actions/cache@v4
        with:
          path: target/*.jar
          key: jar-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            jar-${{ runner.os }}-
      
      - name: Check if JAR exists in cache
        id: check_jar_cache
        run: |
          if [ -f target/*.jar ]; then
            echo "jar_exists=true" >> $GITHUB_OUTPUT
            echo "✅ JAR found in cache, skipping build"
            ls -la target/
          else
            echo "jar_exists=false" >> $GITHUB_OUTPUT
            echo "❌ No JAR in cache, will build"
          fi
      
      - name: Set up JDK
        if: steps.check_jar_cache.outputs.jar_exists == 'false'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Cache Maven dependencies
        if: steps.check_jar_cache.outputs.jar_exists == 'false'
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: maven-deps-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-deps-${{ runner.os }}-
      
      - name: Cache Maven build cache
        if: steps.check_jar_cache.outputs.jar_exists == 'false'
        uses: actions/cache@v4
        with:
          path: |
            target/maven-status
            target/classes
          key: maven-build-${{ runner.os }}-${{ hashFiles('src/**/*', 'pom.xml') }}
          restore-keys: |
            maven-build-${{ runner.os }}-
      
      - name: Build with Maven (only if needed)
        if: steps.check_jar_cache.outputs.jar_exists == 'false'
        run: |
          echo "🔨 Building JAR with Maven..."
          mvn -B package -DskipTests
          echo "✅ Build completed"
          ls -la target/
      
      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar-${{ steps.commit_info.outputs.current_short_sha }}
          path: target/*.jar

  dockerize-and-update:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get current branch name and short SHA
        id: get_current_info
        run: |
          CURRENT_SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/})
          CURRENT_TAG="${CURRENT_SHORT_SHA}-${BRANCH_NAME}"
          
          echo "current_short_sha=$CURRENT_SHORT_SHA" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
          
          echo "✅ Current commit SHA: $CURRENT_SHORT_SHA"
          echo "✅ Current branch: $BRANCH_NAME"
          echo "✅ Current tag will be: $CURRENT_TAG"
      
      - name: Check if current image already exists
        id: check_current_image
        run: |
          CURRENT_TAG=${{ steps.get_current_info.outputs.current_tag }}
          echo "🔍 Checking if current image already exists: jazibumer/scd_proj_image:$CURRENT_TAG"
          
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/jazibumer/scd_proj_image/tags/$CURRENT_TAG/")
          echo "API Response Status: $STATUS"
          
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Current image already exists, will skip building"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "❌ Current image does not exist, need to check for reusable images"
          fi
      
      - name: Get short SHA from dev-kubernetes branch
        id: get_dev_sha
        if: steps.check_current_image.outputs.exists == 'false'
        run: |
          echo "Checking for dev-kubernetes branch..."
          
          # Try to get dev-kubernetes branch SHA
          DEV_FULL_SHA=$(git ls-remote origin refs/heads/dev-kubernetes 2>/dev/null | cut -f1)
          
          if [ -n "$DEV_FULL_SHA" ] && [ "$DEV_FULL_SHA" != "" ]; then
            DEV_SHA=$(echo "$DEV_FULL_SHA" | cut -c1-7)
            DEV_TAG="${DEV_SHA}-dev-kubernetes"
            echo "dev_short_sha=$DEV_SHA" >> $GITHUB_OUTPUT
            echo "dev_tag=$DEV_TAG" >> $GITHUB_OUTPUT
            echo "✅ Dev-kubernetes branch found with SHA: $DEV_SHA"
            echo "✅ Dev-kubernetes tag would be: $DEV_TAG"
          else
            echo "dev_short_sha=" >> $GITHUB_OUTPUT
            echo "dev_tag=" >> $GITHUB_OUTPUT
            echo "❌ Dev-kubernetes branch not found"
          fi
      
      - name: Check if dev-kubernetes image exists on Docker Hub
        id: check_dev_image
        if: steps.check_current_image.outputs.exists == 'false'
        run: |
          DEV_TAG=${{ steps.get_dev_sha.outputs.dev_tag }}
          echo "Checking for dev-kubernetes tag: '$DEV_TAG'"
          
          if [ -z "$DEV_TAG" ] || [ "$DEV_TAG" = "" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "❌ Dev-kubernetes tag is empty, cannot check for existing image"
            exit 0
          fi
          
          # Check if image exists using Docker Hub API
          echo "🔍 Checking for image: jazibumer/scd_proj_image:$DEV_TAG"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/jazibumer/scd_proj_image/tags/$DEV_TAG/")
          echo "API Response Status: $STATUS"
          
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Dev-kubernetes image exists, will reuse it"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "❌ Dev-kubernetes image does not exist (Status: $STATUS), will build new image"
          fi
      
      - name: Log in to Docker Hub
        if: steps.check_current_image.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Reuse and re-tag image from dev-kubernetes
        if: steps.check_current_image.outputs.exists == 'false' && steps.check_dev_image.outputs.exists == 'true'
        run: |
          DEV_TAG=${{ steps.get_dev_sha.outputs.dev_tag }}
          CURRENT_TAG=${{ steps.get_current_info.outputs.current_tag }}
          
          echo "🔄 Reusing dev-kubernetes image with tag: $DEV_TAG"
          echo "🏷️  Re-tagging it with current tag: $CURRENT_TAG"
          
          # Pull the existing dev-kubernetes image
          docker pull jazibumer/scd_proj_image:$DEV_TAG
          
          # Tag it with current commit's tag format only
          docker tag jazibumer/scd_proj_image:$DEV_TAG jazibumer/scd_proj_image:$CURRENT_TAG
          
          # Push the new tag
          docker push jazibumer/scd_proj_image:$CURRENT_TAG
          
          echo "✅ Successfully reused and re-tagged image from dev-kubernetes"
      
      - name: Download JAR artifact for new build
        if: steps.check_current_image.outputs.exists == 'false' && steps.check_dev_image.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: app-jar-${{ steps.get_current_info.outputs.current_short_sha }}
          path: target
      
      - name: Build and push new Docker image
        if: steps.check_current_image.outputs.exists == 'false' && steps.check_dev_image.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: jazibumer/scd_proj_image:${{ steps.get_current_info.outputs.current_tag }}
          build-args: |
            JAR_FILE=target/*.jar
      
      - name: Update GitOps Repository (test branch)
        run: |
          git clone https://${{ secrets.GITOPS_PAT }}@github.com/JAZIB-UMER/SCD-GIT-OPS.git gitops-repo
          cd gitops-repo
          git checkout test
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # Use current tag format (SHA-BranchName)
          TAG=${{ steps.get_current_info.outputs.current_tag }}
          
          echo "Updating deployment with image tag: $TAG"
          sed -i "s|image: jazibumer/scd_proj_image:.*|image: jazibumer/scd_proj_image:$TAG|g" K8s/deployment.yaml
          
          git add K8s/deployment.yaml
          
          if [ "${{ steps.check_current_image.outputs.exists }}" = "true" ]; then
            git commit -m "🔄 Update image tag to $TAG (image already existed)"
          elif [ "${{ steps.check_dev_image.outputs.exists }}" = "true" ]; then
            git commit -m "🔄 Update image tag to $TAG (reused from dev-kubernetes)"
          else
            git commit -m "🔄 Update image tag to $TAG (new build)"
          fi
          git push origin test
