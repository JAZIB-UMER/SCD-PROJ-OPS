name: Reuse or Rebuild Docker Image for Test

on:
  push:
    branches:
      - test

jobs:
  deploy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get short SHA from dev branch
        id: get_dev_sha
        run: |
          DEV_SHA=$(git ls-remote https://github.com/JAZIB-UMER/SCD.git refs/heads/dev | cut -f1 | cut -c1-7)
          echo "DEV_SHORT_SHA=$DEV_SHA" >> $GITHUB_ENV

      - name: Check if dev Docker image exists
        id: check_dev_image
        run: |
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://hub.docker.com/v2/repositories/jazibumer/scd_proj_image/tags/${{ env.DEV_SHORT_SHA }}/)
          echo "Docker Hub Status Code: $STATUS_CODE"
          if [ "$STATUS_CODE" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK
        if: steps.check_dev_image.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        if: steps.check_dev_image.outputs.exists == 'false'
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build with Maven
        if: steps.check_dev_image.outputs.exists == 'false'
        run: mvn -B clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Reuse and re-tag image from dev
        if: steps.check_dev_image.outputs.exists == 'true'
        run: |
          docker pull jazibumer/scd_proj_image:${{ env.DEV_SHORT_SHA }}
          docker tag jazibumer/scd_proj_image:${{ env.DEV_SHORT_SHA }} jazibumer/scd_proj_image:test-latest
          docker push jazibumer/scd_proj_image:test-latest

      - name: Build and push Docker image
        if: steps.check_dev_image.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            jazibumer/scd_proj_image:test-latest
          build-args: |
            JAR_FILE=target/$(ls target | grep '.jar')

      - name: Update GitOps Repository (test branch)
        run: |
          git clone https://${{ secrets.GITOPS_PAT }}@github.com/JAZIB-UMER/SCD-GIT-OPS.git gitops-repo
          cd gitops-repo
          git checkout test
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          sed -i "s|image: jazibumer/scd_proj_image:.*|image: jazibumer/scd_proj_image:test-latest|g" K8s/deployment.yaml

          git add K8s/deployment.yaml
          git commit -m "🔄 Use image for test (from dev or rebuilt)"
          git push origin test
