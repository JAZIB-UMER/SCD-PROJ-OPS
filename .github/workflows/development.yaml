name: Build, Push, and Update GitOps
on:
  push:
    branches:
      - dev-kubernetes
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get current commit info
        id: commit_info
        run: |
          CURRENT_SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "current_short_sha=$CURRENT_SHORT_SHA" >> $GITHUB_OUTPUT
          echo "✅ Current commit SHA: $CURRENT_SHORT_SHA"
      
      - name: Cache JAR files by commit
        id: jar_cache
        uses: actions/cache@v4
        with:
          path: target/*.jar
          key: jar-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            jar-${{ runner.os }}-
      
      - name: Check if JAR exists in cache
        id: check_jar_cache
        run: |
          if [ -f target/*.jar ]; then
            echo "jar_exists=true" >> $GITHUB_OUTPUT
            echo "✅ JAR found in cache, skipping build"
            ls -la target/
          else
            echo "jar_exists=false" >> $GITHUB_OUTPUT
            echo "❌ No JAR in cache, will build"
          fi
      
      - name: Set up JDK
        if: steps.check_jar_cache.outputs.jar_exists == 'false'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Cache Maven dependencies
        if: steps.check_jar_cache.outputs.jar_exists == 'false'
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: maven-deps-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-deps-${{ runner.os }}-
      
      - name: Cache Maven build cache
        if: steps.check_jar_cache.outputs.jar_exists == 'false'
        uses: actions/cache@v4
        with:
          path: |
            target/maven-status
            target/classes
          key: maven-build-${{ runner.os }}-${{ hashFiles('src/**/*', 'pom.xml') }}
          restore-keys: |
            maven-build-${{ runner.os }}-
      
      - name: Build with Maven (only if needed)
        if: steps.check_jar_cache.outputs.jar_exists == 'false'
        run: |
          echo "🔨 Building JAR with Maven..."
          mvn -B package -DskipTests
          echo "✅ Build completed"
          ls -la target/
      
      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar-${{ steps.commit_info.outputs.current_short_sha }}
          path: target/*.jar

  dockerize-and-update:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get current branch name and short SHA
        id: get_current_info
        run: |
          CURRENT_SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/})
          CURRENT_TAG="${CURRENT_SHORT_SHA}-${BRANCH_NAME}"
          
          echo "current_short_sha=$CURRENT_SHORT_SHA" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
          
          echo "✅ Current commit SHA: $CURRENT_SHORT_SHA"
          echo "✅ Current branch: $BRANCH_NAME"
          echo "✅ Current tag will be: $CURRENT_TAG"
      
      - name: Check if Docker image already exists
        id: check_image
        run: |
          CURRENT_TAG=${{ steps.get_current_info.outputs.current_tag }}
          echo "🔍 Checking if image already exists: jazibumer/scd_proj_image:$CURRENT_TAG"
          
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/jazibumer/scd_proj_image/tags/$CURRENT_TAG/")
          echo "API Response Status: $STATUS"
          
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Image already exists, will skip building"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "❌ Image does not exist, will build"
          fi
      
      - name: Download JAR artifact
        if: steps.check_image.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: app-jar-${{ steps.get_current_info.outputs.current_short_sha }}
          path: target
      
      - name: Log in to Docker Hub
        if: steps.check_image.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image with SHA-Branch tag
        if: steps.check_image.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: jazibumer/scd_proj_image:${{ steps.get_current_info.outputs.current_tag }}
          build-args: |
            JAR_FILE=target/*.jar
      
      - name: Update GitOps Repository (dev-kubernetes branch)
        id: update_gitops
        run: |
          git clone https://${{ secrets.GITOPS_PAT }}@github.com/JAZIB-UMER/SCD-GIT-OPS.git gitops-repo
          cd gitops-repo
          git checkout dev-kubernetes
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # Use current tag format (SHA-BranchName)
          TAG=${{ steps.get_current_info.outputs.current_tag }}
          
          echo "Updating deployment with image tag: $TAG"
          sed -i "s|image: jazibumer/scd_proj_image:.*|image: jazibumer/scd_proj_image:$TAG|g" K8s/deployment.yaml
          
          git add K8s/deployment.yaml
          
          if [ "${{ steps.check_image.outputs.exists }}" = "true" ]; then
            COMMIT_MSG="🔄 Update image tag to $TAG (image already existed)"
          else
            COMMIT_MSG="🔄 Update image tag to $TAG (new build)"
          fi
          
          git commit -m "$COMMIT_MSG"
          git push origin dev-kubernetes
          
          # Set output for next step
          echo "commit_message=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

  create-pr-to-test:
    needs: [build, dockerize-and-update]
    runs-on: ubuntu-latest
    steps:
      # Checkout the CURRENT repository (not GitOps repo)
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          # Use the default token for the current repository
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Get current info
        id: get_info
        run: |
          CURRENT_SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/})
          CURRENT_TAG="${CURRENT_SHORT_SHA}-${BRANCH_NAME}"
          
          echo "current_short_sha=$CURRENT_SHORT_SHA" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
          
          echo "✅ Repository: ${{ github.repository }}"
          echo "✅ Current SHA: $CURRENT_SHORT_SHA"
          echo "✅ Current branch: $BRANCH_NAME"
      
      - name: Get latest commit message from source repo
        id: commit_message
        run: |
          # Get the commit message that triggered this workflow
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "commit_message=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "📝 Commit message: $COMMIT_MSG"
      
      - name: Check if test branch exists
        id: check_test_branch
        run: |
          # Check if test branch exists locally or remotely
          if git show-ref --verify --quiet refs/remotes/origin/test; then
            echo "test_branch_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Test branch exists"
          else
            echo "test_branch_exists=false" >> $GITHUB_OUTPUT
            echo "❌ Test branch does not exist, will create it"
          fi
      
      - name: Create test branch if it doesn't exist
        if: steps.check_test_branch.outputs.test_branch_exists == 'false'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # Create test branch from dev-kubernetes
          git checkout -b test
          git push origin test
          echo "✅ Created test branch from dev-kubernetes"
      
      - name: Check if PR already exists from dev-kubernetes to test
        id: check_existing_pr
        run: |
          # Check if PR exists from dev-kubernetes to test in CURRENT repository
          EXISTING_PR=$(gh pr list --repo ${{ github.repository }} --base test --head dev-kubernetes --json number,title --jq '.[0].number // empty')
          
          if [ -n "$EXISTING_PR" ]; then
            echo "pr_exists=true" >> $GITHUB_OUTPUT
            echo "pr_number=$EXISTING_PR" >> $GITHUB_OUTPUT
            echo "✅ Found existing PR #$EXISTING_PR from dev-kubernetes to test"
          else
            echo "pr_exists=false" >> $GITHUB_OUTPUT
            echo "❌ No existing PR found from dev-kubernetes to test"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update existing PR
        if: steps.check_existing_pr.outputs.pr_exists == 'true'
        run: |
          PR_NUMBER="${{ steps.check_existing_pr.outputs.pr_number }}"
          COMMIT_MSG="${{ steps.commit_message.outputs.commit_message }}"
          
          # Add update comment with commit message
          UPDATE_COMMENT="🔄 **Workflow Triggered - New Changes Available**
          
          **Latest Commit:** $COMMIT_MSG
          **Image Tag:** \`${{ steps.get_info.outputs.current_tag }}\`
          **Updated at:** $(date)
          **Triggered by:** ${{ github.actor }}
          
          ### 📋 Changes
          - Updated deployment image to: \`jazibumer/scd_proj_image:${{ steps.get_info.outputs.current_tag }}\`
          - This PR now contains the latest changes from dev-kubernetes
          
          **Ready for review!** ✅"
          
          gh pr comment $PR_NUMBER --repo ${{ github.repository }} --body "$UPDATE_COMMENT"
          echo "✅ Updated existing PR #$PR_NUMBER with latest changes"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create new Pull Request
        if: steps.check_existing_pr.outputs.pr_exists == 'false'
        run: |
          COMMIT_MSG="${{ steps.commit_message.outputs.commit_message }}"
          
          PR_TITLE="🚀 Deploy to Test: $COMMIT_MSG"
          PR_BODY="## 🚀 Automated Deployment PR
          
          **Commit Message:** $COMMIT_MSG
          **Image Tag:** \`${{ steps.get_info.outputs.current_tag }}\`
          **Source Branch:** \`dev-kubernetes\`
          **Target Branch:** \`test\`
          **Triggered by:** ${{ github.actor }}
          **Created:** $(date)
          
          ### 📋 Changes
          - Updated deployment image to: \`jazibumer/scd_proj_image:${{ steps.get_info.outputs.current_tag }}\`
          - Latest commit: $COMMIT_MSG
          
          ### 🔍 Verification Checklist
          - [ ] Review deployment changes
          - [ ] Verify image tag is correct
          - [ ] Test environment deployment
          
          **Auto-generated by GitHub Actions** 🤖"
          
          gh pr create \
            --repo ${{ github.repository }} \
            --base test \
            --head dev-kubernetes \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --label "enhancement"
          
          echo "✅ Pull Request created successfully!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
